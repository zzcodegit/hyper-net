version: "3.9"

services:
  node1:
    build: .
    container_name: hypernet-node-1
    environment:
      - PORT=4001
      - KEY_PATH=/tmp/node.key
      - DHT=true
      - DHT_MODE=server
      # Явно включаем прокси-протоколы для smoke-тестов (HTTP, ifconfig.me, iperf3)
      - PROXY_PROTOCOLS=vless,vmess,trojan,shadowsocks,hysteria2,plain
    ports:
      - "4001:4001"

  node2:
    build: .
    container_name: hypernet-node-2
    environment:
      - PORT=4002
      - KEY_PATH=/tmp/node.key
      - DHT=true
      - DHT_MODE=client
    ports:
      - "4002:4002"

  relay:
    build: .
    container_name: hypernet-relay
    environment:
      - PORT=4003
      - KEY_PATH=/tmp/node.key
      - RELAY=true
      - DHT=true
      - DHT_MODE=server
    ports:
      - "4003:4003"

