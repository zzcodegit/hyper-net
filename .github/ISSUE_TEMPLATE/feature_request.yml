name: Feature Request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe your proposed implementation.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Architectural Impact
      description: How does this affect layering and boundaries?
    validations:
      required: false
